name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do everything except changes to state (no push, release, pull request or upload to Central)
        type: boolean
        default: true
      next_version:
        description: Next development version as X.Y.Z (-SNAPSHOT is appended); defaults to the next patch version
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release-staging
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      next_version: ${{ steps.version.outputs.next_version }}
      previous_version: ${{ steps.check.outputs.previous_version }}
      hashes: ${{ steps.assets.outputs.hashes }}
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      NEXT_VERSION_INPUT: ${{ inputs.next_version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad #v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          gpg-private-key: ${{ secrets.OSSRH_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Derive and validate versions
        id: version
        run: |
          set -euo pipefail
          current=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout | tail -n 1)
          if [[ ! "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-SNAPSHOT$ ]]; then
            echo "::error::pom version '$current' is not X.Y.Z-SNAPSHOT"
            exit 1
          fi
          release="${current%-SNAPSHOT}"
          if [[ ! "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release version '$release' is not X.Y.Z"
            exit 1
          fi
          next="${NEXT_VERSION_INPUT:-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))}"
          if [[ ! "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::next version '$next' is not X.Y.Z"
            exit 1
          fi
          echo "version=$release" >> "$GITHUB_OUTPUT"
          echo "next_version=$next-SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "Releasing $release, next development version $next-SNAPSHOT"

      - name: Check the release can be made
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != "true" && "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Releases must be made from master, not $GITHUB_REF"
            exit 1
          fi
          if git ls-remote --exit-code --tags "https://github.com/$GH_REPO.git" "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi
          url="https://repo1.maven.org/maven2/uk/co/foundationsedge/nv-i18n/$VERSION/nv-i18n-$VERSION.pom"
          status=$(curl -s -o /dev/null -w '%{http_code}' --head "$url")
          if [[ "$status" != "404" ]]; then
            echo "::error::$url returned HTTP $status, expected 404"
            exit 1
          fi
          previous=$(git ls-remote --tags --refs "https://github.com/$GH_REPO.git" | sed 's#.*refs/tags/##' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | { cat; echo "$VERSION"; } | sort -Vu | grep -x -B1 "$VERSION" | head -n 1)
          if [[ "$previous" == "$VERSION" ]]; then previous=""; fi
          echo "previous_version=$previous" >> "$GITHUB_OUTPUT"

      - name: Configure git signing
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
          printf '#!/bin/sh\nexec gpg --batch --pinentry-mode loopback --passphrase-file "%s" "$@"\n' \
            "$RUNNER_TEMP/gpg-passphrase" > "$RUNNER_TEMP/gpg-wrapper"
          chmod 700 "$RUNNER_TEMP/gpg-wrapper"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.signingkey "$key"
          git config gpg.program "$RUNNER_TEMP/gpg-wrapper"

      - name: Commit and sign the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./mvnw -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          git commit -am "Release $VERSION"
          git tag -s -m "Release $VERSION" "$VERSION"
          git tag -v "$VERSION"

      - name: Build, sign and bundle for Maven Central
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B deploy -PsonatypeDeploy -DskipUpload=true

      - name: Collect release assets
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging/assets
          cp "target/nv-i18n-$VERSION"*.jar "target/nv-i18n-$VERSION.pom" "target/nv-i18n-$VERSION"*.asc staging/assets/
          for ext in json xml; do
            cp "target/bom.$ext" "staging/assets/nv-i18n-$VERSION-cyclonedx.$ext"
            cp "target/bom.$ext.asc" "staging/assets/nv-i18n-$VERSION-cyclonedx.$ext.asc"
          done
          cp target/central-publishing/central-bundle.zip staging/
          git bundle create staging/release.bundle "refs/tags/$VERSION"
          ls -l staging staging/assets
          echo "hashes=$(cd staging/assets && sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/gpg-passphrase" "$RUNNER_TEMP/gpg-wrapper"

      - name: Upload staged release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging
          path: staging
          if-no-files-found: error

      - name: Preview the next development version
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          PREVIOUS_VERSION: ${{ steps.check.outputs.previous_version }}
        run: |
          set -euo pipefail
          git diff HEAD~1 -- pom.xml
          ./mvnw -B versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false
          git diff -- pom.xml
          {
            echo "### Dry run for $VERSION"
            echo "Next development version: $NEXT_VERSION"
            echo "Previous release tag for release notes: ${PREVIOUS_VERSION:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PREVIOUS_VERSION: ${{ needs.build.outputs.previous_version }}
      HASHES: ${{ needs.build.outputs.hashes }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          persist-credentials: false

      - name: Download staged release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging
          path: staging

      - name: Verify the staged release
        run: |
          set -euo pipefail
          actual=$(cd staging/assets && sha256sum -- * | base64 -w0)
          if [[ "$actual" != "$HASHES" ]]; then
            echo "::error::Staged assets do not match the hashes computed by the build job"
            exit 1
          fi

      - name: Push the tag
        run: |
          set -euo pipefail
          git fetch staging/release.bundle "refs/tags/$VERSION:refs/tags/$VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "refs/tags/$VERSION"

      - name: Publish to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          token=$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w0)
          echo "::add-mask::$token"
          central() { curl -sS --fail-with-body -K <(printf 'header = "Authorization: Bearer %s"\n' "$token") "$@"; }
          id=$(central -F "bundle=@staging/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=nv-i18n-$VERSION&publishingType=AUTOMATIC")
          echo "Central deployment $id"
          for _ in $(seq 1 120); do
            state=$(central -X POST "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq -r .deploymentState)
            echo "Deployment state: $state"
            if [[ "$state" == "PUBLISHED" ]]; then exit 0; fi
            if [[ "$state" == "FAILED" ]]; then exit 1; fi
            sleep 30
          done
          echo "::error::Timed out waiting for Central to publish"
          exit 1

      - name: Create the GitHub Release
        run: |
          set -euo pipefail
          notes=(--generate-notes)
          if [[ -n "$PREVIOUS_VERSION" ]]; then notes+=(--notes-start-tag "$PREVIOUS_VERSION"); fi
          gh release create "$VERSION" --verify-tag --title "$VERSION" "${notes[@]}" staging/assets/*

  provenance:
    needs: [build, publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && (inputs.dry_run || needs.publish.result == 'success') }}
    permissions:
      actions: read
      id-token: write
      contents: write
    # zizmor: ignore[unpinned-uses] the SLSA generator must be referenced by tag, not SHA
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: ${{ !inputs.dry_run }}
      upload-tag-name: ${{ needs.build.outputs.version }}

  bump:
    needs: [build, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      NEXT_VERSION: ${{ needs.build.outputs.next_version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad #v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Open the next development version PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ ! "$NEXT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]]; then
            echo "::error::next version '$NEXT_VERSION' is not X.Y.Z-SNAPSHOT"
            exit 1
          fi
          branch="release/next-$NEXT_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          ./mvnw -B versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false
          git commit -am "Prepare next development version $NEXT_VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$branch"
          gh pr create --base master --head "$branch" \
            --title "Prepare next development version $NEXT_VERSION" \
            --body "Sets the pom version to $NEXT_VERSION after the release."
